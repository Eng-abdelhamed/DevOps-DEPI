apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-pod
rules:
  resourceNames:
  - pod1
  - pod2
  - pod3
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: role-binding-pod
subjects:
- kind: User
  name: user1
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: role-pod
  apiGroup: rbac.authorization.k8s.io
